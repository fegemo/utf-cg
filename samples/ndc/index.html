<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <canvas id="main-canvas" width="200" height="200"></canvas>
    <script id="vs" type="text/glsl">#version 300 es
        in vec4 position;
        in vec2 texcoord;
        out vec2 v_texCoord;
        
        uniform mat4 u_projection;
        uniform mat4 u_modelView;
        uniform mat4 u_textureMatrix;
        
        void main() {
            gl_Position = u_projection * u_modelView * position;
            v_texCoord = mat2(u_textureMatrix) * texcoord;
        }
    </script>
    <script id="fs" type="text/glsl">#version 300 es
        precision mediump float;
        
        in vec2 v_texCoord;
        uniform vec4 u_color;
        uniform bool u_isWire;
        uniform float u_alphaThreshold;
        uniform sampler2D u_diffuse;
        out vec4 outColor;
        
        void main() {
            vec4 color = u_isWire == true ? u_color : (texture(u_diffuse, v_texCoord) * u_color);
            
            if (color.a < u_alphaThreshold) {
                discard;
            }
            outColor = color;
            
        }
    </script>
    <script type="module">
        import { initialize } from './main.js'
        initialize('#main-canvas')
    </script>
</body>
</html>
